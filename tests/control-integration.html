<!doctype html><meta charset="utf-8"><title>Close control regression</title>
<style>body{background:#101625;color:white;font:15px system-ui}pre{white-space:pre-wrap}iframe{width:100%;height:620px}</style>
<h1>Close control regression</h1><pre id="results">Loading…</pre><iframe src="../?autostart=1&fx=off"></iframe>
<script type="module">
const output=document.querySelector('#results');
const timer=setInterval(async()=>{
 const w=document.querySelector('iframe').contentWindow,g=w.__game;if(!g?.ui.game||g.athletes.length!==12)return;
 clearInterval(timer);w.__hold=true;const report={scenarios:[]};
 try{
  g.controllers=[];g.state='play';g.practice=true;g.slowmo=0;g.hitstop=0;
  for(const a of g.athletes){a.place(-20,-12,0);a.frozen=true;a.intent.move.set(0,0);a.intent.kick=a.intent.lob=a.intent.pass=a.intent.sprint=false;}
  const player=g.athletes.find(a=>!a.isKeeper),assert=(ok,message)=>{if(!ok)throw Error(message);};
  for(const fps of [30,60,144]){
   player.place(0,-5,0);player.frozen=false;player._needRelease=false;player.intent.sprint=false;
   g.ball.reset(-player.reachS,player.pos.z+player.reachF);g.ball.lastTouch=player;g.ball.carryBy=player;g.ball.carryGuard=1.2;player.lastTouchTime=g.time;
   const scenario={fps,segments:[]};report.scenarios.push(scenario);
   for(const [name,x,z,seconds] of [['straight',0,1,1.2],['right90',1,0,.8],['reverse',-1,0,1.2],['release',0,0,1],['restart',0,1,1],['stopAgain',0,0,.8],['sprint',0,1,1.2],['stopSprint',0,0,1.2]]){
    player.intent.move.set(x,z);player.intent.sprint=name==='sprint';let maxGap=0;const from=player.pos.clone(),ballFrom=g.ball.pos.clone();
    for(let i=0;i<Math.ceil(seconds*fps);i++){w.__step(1,1/fps,false);maxGap=Math.max(maxGap,player.pos.distanceTo(g.ball.pos));}
    const distance=player.pos.distanceTo(g.ball.pos),speed=g.ball.groundSpeed;
    const playerTravel=player.pos.distanceTo(from),ballTravel=g.ball.pos.distanceTo(ballFrom);
    scenario.segments.push({name,maxGap,distance,speed,playerTravel,ballTravel});
    if(name==='reverse')assert(ballTravel>.5,`${fps} Hz reverse: failed to move after pivot`);
    if(name==='straight'||name==='restart'||name==='sprint')assert(ballTravel>1.4,`${fps} Hz ${name}: ball stuck (${ballTravel.toFixed(2)}m)`);
    assert(distance<1.4,`${fps} Hz ${name}: lost ball by ${distance.toFixed(2)}m`);
    if(name==='release'||name==='stopAgain'||name==='stopSprint')assert(speed<.65,`${fps} Hz ${name}: ball did not settle (${speed.toFixed(2)}m/s)`);
    await new Promise(resolve=>setTimeout(resolve,0));
   }
  }
  report.pickups=[];
  for(const id of ['thunder','blaze','frost','gale','phantom','cannon']){
   player.intent.sprint=false;player.char.setStyle(id);player.charId=id;player.place(0,-4,0);player.frozen=false;player.intent.move.set(0,1);
   g.ball.reset(0,-2.7);g.ball.lastTouch=null;g.ball.carryBy=null;g.ball.carryGuard=0;
   for(let i=0;i<120;i++)w.__step(1,1/60,false);
   const distance=player.pos.distanceTo(g.ball.pos);report.pickups.push({id,distance,owned:g.ball.lastTouch===player});
   assert(g.ball.lastTouch===player&&distance<1.4,`${id}: could not collect loose ball`);
   await new Promise(resolve=>setTimeout(resolve,0));
  }
  assert(g.contactLog.every(e=>e.distance<=e.radius+1e-6),'contact without geometry');report.geometricContacts=true;
  output.textContent='PASS '+JSON.stringify(report,null,2);
 }catch(error){output.textContent='FAIL '+error.stack+'\n'+JSON.stringify(report,null,2);}
},250);
</script>
