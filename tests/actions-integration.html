<!doctype html><meta charset="utf-8"><title>Action key and arcade rules</title>
<style>body{font:15px system-ui;background:#101625;color:white}pre{white-space:pre-wrap}iframe{width:100%;height:600px}</style>
<h1>Action key and arcade rules</h1><pre id="results">Loading…</pre><iframe src="../?autostart=1&fx=off"></iframe>
<script type="module">
const output=document.querySelector('#results');
const timer=setInterval(()=>{
 const w=document.querySelector('iframe').contentWindow,g=w.__game;if(!g?.ui.game)return;
 clearInterval(timer);w.__hold=true;const report={defensive:[],attacking:[]},assert=(ok,m)=>{if(!ok)throw Error(m);};
 try{
  g.start({...g.ui.settings,mode:'match5',humans:1});g.controllers=[];g.practice=true;g.state='play';
  const player=g.athletes.find(a=>!a.isKeeper),other=g.athletes.find(a=>a.gi!==player.gi);
  for(const a of g.athletes)if(a!==player)a.out=true;
  const methods=['_startPower','_startSkill','_startPoke','_startSlide','_offBallSkill','_startTackleMove'],original={};let calls=[];
  for(const name of methods){original[name]=player[name];player[name]=function(...args){calls.push(name);return original[name].apply(this,args);};}
  const reset=(id,cd,distance,own=false)=>{
   player.char.setStyle(id);player.charId=id;player.place(0,-4,0);player.frozen=false;player._prevTackle=false;player.intent.move.set(0,1);player.intent.tackle=true;player.intent.sprint=false;
   player.intent.kick=player.intent.pass=player.intent.lob=player.intent.chipShot=false;player.slideCD=0;player.powerCD=cd;player.skillCD=0;player.dribbling=own;player._needRelease=false;
   g.state='play';g.ball.reset(0,player.pos.z+distance);g.ball.lastTouch=own?player:other;g.ball.carryBy=own?player:null;g.ball.carryGuard=own?1.2:0;g.possessor=own?player:other;player.lastTouchTime=g.time;calls=[];
  };
  for(const id of ['thunder','blaze','frost','gale','phantom','cannon'])for(const fps of [30,60,144])for(const cd of [0,3])for(const distance of [1.2,3.4]){
   reset(id,cd,distance);const mode=player.actionButtonMode();w.__step(1,1/fps,false);
   // off the ball the key is always this character's element slide, at any distance, cooldown or speed
   assert(mode==='tackle'&&calls.length===1&&calls[0]==='_startSlide',`${id}/${fps}/${cd}/${distance}: ${calls}`);
   assert(!player.power&&!player.tm&&player.slide?.kind===id,`${id}: not an element slide`);
   assert(player.slideCD===0,`${id}: slide has a cooldown`);
   report.defensive.push({id,fps,cd,distance,action:calls[0]});
  }
  for(const id of ['thunder','blaze','frost','gale','phantom','cannon'])for(const cd of [0,3]){
   reset(id,cd,.5,true);assert(player.actionButtonMode()==='skill',`${id}: own ball mode`);w.__step(1,1/60,false);
   assert(calls[0]===(cd===0?'_startPower':'_startSkill'),`${id}: on-ball action ${calls}`);report.attacking.push({id,cd,action:calls[0]});
  }
  // the camp game: a slide whose camp beats the carrier's always wins the ball, its own way
  const duel=(id,vs)=>{
   reset(id,3,1.6);player.intent.tackle=true;other.out=false;other.charId=vs;other.char.setStyle(vs);other.place(0,player.pos.z+1.9,Math.PI);other.vel.set(0,0,0);other.frozen=false;other.stunT=0;other.power=null;other.trick=null;
   g.ball.reset(0,player.pos.z+1.6);g.possessor=other;g.ball.lastTouch=other;other.dribbling=true;
   w.__step(1,1/60,false);player.intent.tackle=false;let sp=0;
   for(let i=0;i<40&&!player.slide?.won;i++)w.__step(1,1/60,false);
   sp=Math.hypot(g.ball.vel.x,g.ball.vel.z);const won=!!player.slide?.won||g.ball.lastTouch===player;other.out=true;return {won,ballSpeed:+sp.toFixed(2)};
  };
  report.camps={};
  for(const [id,vs] of [['frost','thunder'],['gale','phantom'],['blaze','gale'],['cannon','frost'],['thunder','blaze'],['phantom','cannon']]){
   const r=duel(id,vs);report.camps[id+'>'+vs]=r;assert(r.won,`${id} vs ${vs}: favourable slide lost the ball`);
   if(id==='frost'||id==='gale')assert(r.ballSpeed<3,`${id}: control slide did not keep the ball close`);else assert(r.ballSpeed>5,`${id}: ball not knocked away`);
  }
  // a slide that touches nothing: no cooldown, but a long lie-down
  reset('blaze',3,12);w.__step(1,1/60,false);player.intent.tackle=false;for(let i=0;i<70;i++)w.__step(1,1/60,false);
  assert(!player.slide&&player.stunT>0.6,'missed slide not punished: '+player.stunT);report.whiff={stun:+player.stunT.toFixed(2),cd:player.slideCD};
  reset('thunder',0,4);g.ball.lastTouch=player;g.possessor=player;player.dribbling=true;
  assert(player.actionButtonMode()==='tackle','stale possession triggered skill');
  for(const name of methods)player[name]=original[name];
  let whistles=0,cards=0,penalties=0;const whistle=g.sfx.whistle,card=g._card,penalty=g._penalty;
  g.sfx.whistle=()=>whistles++;g._card=()=>cards++;g._penalty=()=>penalties++;
  try{for(const kind of [null,'yellow','red']){g.onFoul(player,other,kind);g.time+=1;g._foulTick();g._cardsTick(1);}}
  finally{g.sfx.whistle=whistle;g._card=card;g._penalty=penalty;}
  assert(!g._pendFoul&&whistles===0&&cards===0&&penalties===0&&g.state==='play','foul still stopped play');
  report.noFouls={whistles,cards,penalties};
  output.textContent='PASS '+JSON.stringify(report,null,2);
 }catch(error){output.textContent='FAIL '+error.stack+'\n'+JSON.stringify(report,null,2);}
},250);
</script>
