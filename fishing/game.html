<title>静湖垂钓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="写实风格的湖边钓鱼游戏，手机竖屏横屏都能玩。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: the lake fills the screen; a thin status strip on top, one big thumb button at the bottom.
   One look only (dusk lake), so colours are set explicitly rather than themed. */
:root {
  --ink: #f4efe4;          /* paper-white text */
  --ink-dim: #c9c1ae;
  --wood: #6b4a2f;         /* rod handle / buttons */
  --brass: #e2b25a;        /* reel, highlights */
  --reed: #8fae6a;         /* safe tension */
  --warn: #e98a3a;
  --danger: #d94a3a;
  --glass: rgba(20, 26, 24, 0.58);
  --title: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: #20302c; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
[hidden] { display: none !important; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font-family: var(--body); -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }

/* top status strip */
#bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(10, 14, 12, 0.55), rgba(10, 14, 12, 0)); pointer-events: none; }
#bar .chip { pointer-events: auto; display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid rgba(244, 239, 228, 0.18);
  border-radius: 999px; padding: 8px 14px; font-size: 17px; color: var(--ink); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#bar .chip b { color: var(--brass); font-weight: 700; font-variant-numeric: tabular-nums; }
#bar button.chip { cursor: pointer; }

/* centre message (big, short, fades) */
#msg { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;
  font-size: clamp(26px, 7vw, 40px); font-family: var(--title); color: var(--ink); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6); opacity: 0; transition: opacity 0.35s; white-space: nowrap; }
#msg.show { opacity: 1; }
#msg small { display: block; font-family: var(--body); font-size: 17px; color: var(--ink-dim); margin-top: 6px; }

/* bottom controls */
#controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(10, 14, 12, 0), rgba(10, 14, 12, 0.55)); }
#meter { width: min(520px, 100%); display: none; }
#meter.on { display: block; }
#meter .lbl { display: flex; justify-content: space-between; font-size: 15px; color: var(--ink-dim); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
#meter .track { position: relative; height: 18px; border-radius: 9px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(244, 239, 228, 0.25); overflow: hidden; }
#meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(143, 174, 106, 0.35); }
#meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--reed); transition: background 0.15s; }
#meter .fill.warn { background: var(--warn); }
#meter .fill.danger { background: var(--danger); }
#main { width: min(520px, 100%); min-height: 76px; border-radius: 22px; border: 0; font-size: 26px; font-weight: 700; letter-spacing: 4px;
  color: #2a1c10; background: linear-gradient(#f0cf86, var(--brass)); box-shadow: 0 6px 0 #8e6a2c, 0 10px 24px rgba(0, 0, 0, 0.35); cursor: pointer; touch-action: none; }
#main:active, #main.held { transform: translateY(3px); box-shadow: 0 3px 0 #8e6a2c, 0 6px 14px rgba(0, 0, 0, 0.35); }
#main.alert { background: linear-gradient(#ff9b7c, var(--danger)); color: #fff; box-shadow: 0 6px 0 #7a2418; animation: pulse 0.45s infinite alternate; }
#main.calm { background: rgba(30, 38, 34, 0.75); color: var(--ink-dim); box-shadow: none; border: 1px solid rgba(244, 239, 228, 0.25); font-weight: 500; letter-spacing: 2px; }
@keyframes pulse { to { transform: scale(1.03); } }
#hint { font-size: 15px; color: var(--ink-dim); text-align: center; min-height: 1.2em; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }

/* panels */
.panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 12, 10, 0.55);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(440px, 100%); max-height: 100%; overflow: auto; background: rgba(28, 34, 30, 0.94); border: 1px solid rgba(226, 178, 90, 0.35); border-radius: 22px; padding: 22px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
.card h1 { font-family: var(--title); font-weight: 400; font-size: 46px; margin: 0; color: var(--brass); text-align: center; letter-spacing: 6px; }
.card h2 { font-family: var(--title); font-weight: 400; font-size: 34px; margin: 0 0 4px; text-align: center; color: var(--ink); }
.card p { font-size: 17px; line-height: 1.6; color: var(--ink-dim); margin: 10px 0; }
.card .btns { display: flex; gap: 10px; margin-top: 16px; }
.card > button { width: 100%; }
.card .btns button, .card > button { flex: 1; min-height: 60px; border-radius: 16px; border: 0; font-size: 21px; font-weight: 700; cursor: pointer; }
.btn-gold { background: linear-gradient(#f0cf86, var(--brass)); color: #2a1c10; }
.btn-ghost { background: rgba(244, 239, 228, 0.1); color: var(--ink); border: 1px solid rgba(244, 239, 228, 0.25) !important; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0 4px; }
.stat { background: rgba(0, 0, 0, 0.28); border-radius: 14px; padding: 10px 12px; text-align: center; }
.stat span { display: block; font-size: 14px; color: var(--ink-dim); }
.stat b { font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; }
.badge { display: inline-block; background: var(--danger); color: #fff; font-size: 14px; border-radius: 999px; padding: 3px 10px; margin-left: 6px; vertical-align: middle; }
.rare { text-align: center; color: var(--brass); font-size: 16px; letter-spacing: 3px; }
.how { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 16px; color: var(--ink-dim); margin: 14px 0; }
.how b { color: var(--ink); white-space: nowrap; }
.baits { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
.bait { min-height: 72px; border-radius: 16px; border: 2px solid rgba(244, 239, 228, 0.15); background: rgba(0, 0, 0, 0.25); color: var(--ink); font-size: 19px; cursor: pointer; text-align: left; padding: 10px 12px; }
.bait small { display: block; font-size: 13px; color: var(--ink-dim); margin-top: 2px; }
.bait.on { border-color: var(--brass); background: rgba(226, 178, 90, 0.16); }
.log { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 16px; }
.log th { color: var(--ink-dim); font-weight: 500; text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(244, 239, 228, 0.15); }
.log td { padding: 8px 4px; border-bottom: 1px solid rgba(244, 239, 228, 0.08); font-variant-numeric: tabular-nums; }
.log td.dim { color: var(--ink-dim); }
/* the catch card sits low so the fish stays in view above it */
#catch { align-items: flex-end; background: linear-gradient(rgba(8, 12, 10, 0), rgba(8, 12, 10, 0.6) 55%); }
@media (prefers-reduced-motion: reduce) { #main.alert { animation: none; } }
</style>

<canvas id="view"></canvas>

<div id="bar">
  <button class="chip" id="btn-bait" type="button">鱼饵 <b id="bait-name">蚯蚓</b></button>
  <div class="chip">渔获 <b id="count">0</b> 条</div>
  <button class="chip" id="btn-log" type="button">鱼护</button>
</div>
<div id="msg"></div>
<div id="controls">
  <div id="meter">
    <div class="lbl"><span id="meter-left">力度</span><span id="meter-right"></span></div>
    <div class="track"><div class="zone" id="zone"></div><div class="fill" id="fill"></div></div>
  </div>
  <button id="main" type="button">按住 抛竿</button>
  <div id="hint">左右滑动屏幕可以转向，按住按钮蓄力，松手抛出去</div>
</div>

<div class="panel" id="start">
  <div class="card">
    <h1>静湖垂钓</h1>
    <p style="text-align:center">傍晚的湖边，风很轻。挑个鱼饵，甩一竿。</p>
    <div class="how">
      <b>抛竿</b><span>按住大按钮蓄力，松手抛出。左右滑动屏幕换方向。</span>
      <b>等口</b><span>浮漂轻轻点两下是试口，别急；整个被拖下水才是真咬钩。</span>
      <b>提竿</b><span>按钮变红、手机一震，马上点一下。</span>
      <b>遛鱼</b><span>按住收线，松手放线。线的拉力保持在绿色区间里，鱼没劲了就拉上来了。</span>
    </div>
    <button class="btn-gold" id="btn-start" type="button">开始钓鱼</button>
  </div>
</div>

<div class="panel" id="catch" hidden>
  <div class="card">
    <div class="rare" id="c-rare"></div>
    <h2 id="c-name">鲫鱼</h2>
    <div class="stats">
      <div class="stat"><span>重量</span><b id="c-weight">0.00 斤</b></div>
      <div class="stat"><span>体长</span><b id="c-length">0 厘米</b></div>
    </div>
    <p id="c-note"></p>
    <div class="btns">
      <button class="btn-ghost" id="btn-release" type="button">放生</button>
      <button class="btn-gold" id="btn-keep" type="button">放进鱼护</button>
    </div>
  </div>
</div>

<div class="panel" id="baits" hidden>
  <div class="card">
    <h2>换鱼饵</h2>
    <p>不同的鱼爱吃不同的饵。</p>
    <div class="baits" id="bait-list"></div>
    <div class="btns"><button class="btn-gold" id="btn-bait-ok" type="button">好了</button></div>
  </div>
</div>

<div class="panel" id="logp" hidden>
  <div class="card">
    <h2>鱼护</h2>
    <p id="log-sum"></p>
    <table class="log"><thead><tr><th>鱼</th><th>条数</th><th>最大</th></tr></thead><tbody id="log-body"></tbody></table>
    <div class="btns"><button class="btn-gold" id="btn-log-ok" type="button">回去钓鱼</button></div>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ============================================================ data =========
// weights in kg; shown to the player in 斤 (1 斤 = 0.5 kg), lengths in cm
const FISH = [
  { id: 'jiyu',   name: '鲫鱼',   w: [0.08, 0.7],  k: 0.017,  pull: 0.35, bait: { worm: 5, dough: 5, corn: 2, shrimp: 1 }, color: ['#4d5a4a', '#b9b49a', '#e8e2c8'], body: 'deep' },
  { id: 'liyu',   name: '鲤鱼',   w: [0.6, 7],     k: 0.0145, pull: 0.75, bait: { worm: 2, dough: 4, corn: 5, shrimp: 1 }, color: ['#6a5530', '#c39a4e', '#efd9a3'], body: 'carp', fins: '#b8522e' },
  { id: 'caoyu',  name: '草鱼',   w: [0.8, 9],     k: 0.011,  pull: 0.8,  bait: { worm: 1, dough: 2, corn: 4, shrimp: 0 }, color: ['#4f5a3c', '#a8a27a', '#e6e0c4'], body: 'long' },
  { id: 'lianyu', name: '鲢鱼',   w: [0.8, 7],     k: 0.012,  pull: 0.7,  bait: { worm: 0, dough: 4, corn: 1, shrimp: 0 }, color: ['#5d6b72', '#c7ccc9', '#f2f2ec'], body: 'long' },
  { id: 'bianyu', name: '鳊鱼',   w: [0.25, 1.4],  k: 0.02,   pull: 0.4,  bait: { worm: 3, dough: 3, corn: 1, shrimp: 1 }, color: ['#596257', '#c8c9bd', '#f0efe6'], body: 'flat' },
  { id: 'luofei', name: '罗非鱼', w: [0.25, 1.6],  k: 0.019,  pull: 0.5,  bait: { worm: 4, dough: 2, corn: 1, shrimp: 2 }, color: ['#3f4a48', '#7d8a86', '#c9cfc6'], body: 'deep', stripes: 'rgba(30,36,34,0.35)' },
  { id: 'qiaozui', name: '翘嘴', w: [0.4, 3.5],   k: 0.009,  pull: 0.85, bait: { worm: 1, dough: 0, corn: 0, shrimp: 4 }, color: ['#5a6670', '#d4d8d6', '#f7f7f3'], body: 'slim' },
  { id: 'heiyu',  name: '黑鱼',   w: [0.8, 5],     k: 0.0095, pull: 1.0,  bait: { worm: 1, dough: 0, corn: 0, shrimp: 3 }, color: ['#2b2a24', '#5c5848', '#bdb6a0'], body: 'snake', blotch: 'rgba(15,14,10,0.6)' },
  { id: 'guiyu',  name: '鳜鱼',   w: [0.3, 2.5],   k: 0.016,  pull: 0.9,  bait: { worm: 0, dough: 0, corn: 0, shrimp: 2 }, color: ['#5b5a2e', '#b5a45e', '#ece2b2'], body: 'deep', spots: 'rgba(40,30,10,0.65)', rare: true },
  { id: 'qingyu', name: '青鱼',   w: [4, 18],      k: 0.0105, pull: 1.25, bait: { worm: 0, dough: 0, corn: 1, shrimp: 1 }, color: ['#1f2a2e', '#3f4c50', '#a9b0ac'], body: 'long', rare: true },
];
const BAITS = [
  { id: 'worm', name: '蚯蚓', note: '鲫鱼、罗非、鳊鱼爱吃' },
  { id: 'dough', name: '面饵', note: '鲫鱼、鲤鱼、鲢鱼' },
  { id: 'corn', name: '玉米', note: '鲤鱼、草鱼，偶尔青鱼' },
  { id: 'shrimp', name: '活虾', note: '翘嘴、黑鱼、鳜鱼' },
];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const save = store.get('jinghu-save', { bait: 'worm', log: {} });

// ============================================================ renderer =====
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 2500);
scene.add(camera);
// a soft light from behind your shoulder so the rod and a fish in your hands aren't just silhouettes
{ const fill = new THREE.PointLight(0xfff0dd, 1.4, 6, 1.5); fill.position.set(-0.4, 0.6, 0.6); camera.add(fill); }

// late-afternoon light, sun low over the far shore
const SUN_DIR = new THREE.Vector3(-0.18, 0.2, -1).normalize();
const SUN_COL = new THREE.Color(1.0, 0.82, 0.58);
const HORIZON = new THREE.Color(0.97, 0.78, 0.6);
const ZENITH = new THREE.Color(0.2, 0.38, 0.7);
scene.fog = new THREE.Fog(HORIZON.clone().multiplyScalar(0.85), 220, 1100);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4a4a32, 1.1));
const sun = new THREE.DirectionalLight(0xffd6a0, 2.4); sun.position.copy(SUN_DIR).multiplyScalar(100); scene.add(sun);

const GLSL_NOISE = `
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ v += a*noise(p); p *= 2.03; a *= 0.5; } return v; }
`;
const GLSL_SKY = `
  uniform vec3 uSun, uSunCol, uHor, uZen;
  vec3 skyCol(vec3 d){
    float h = clamp(d.y, -0.2, 1.0);
    vec3 c = mix(uHor, uZen, pow(clamp(h, 0.0, 1.0), 0.55));
    float s = max(dot(d, uSun), 0.0);
    c += uSunCol * (pow(s, 6.0) * 0.35 + pow(s, 60.0) * 0.6) ;
    c += uSunCol * smoothstep(0.9993, 0.9997, s) * 8.0;          // the sun's disc
    return c;
  }
`;
const skyUniforms = { uSun: { value: SUN_DIR }, uSunCol: { value: SUN_COL }, uHor: { value: HORIZON }, uZen: { value: ZENITH }, uTime: { value: 0 } };

// ---- sky dome with soft clouds -------------------------------------------------
{
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyUniforms,
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
    fragmentShader: `${GLSL_NOISE}${GLSL_SKY} uniform float uTime; varying vec3 vD;
      void main(){ vec3 d = normalize(vD); vec3 c = skyCol(d);
        if (d.y > 0.0){ vec2 uv = d.xz / (d.y + 0.15) * 1.6 + vec2(uTime * 0.004, 0.0);
          float cl = smoothstep(0.52, 0.85, fbm(uv)) * smoothstep(0.0, 0.25, d.y);
          vec3 cc = mix(vec3(1.0, 0.9, 0.82), uSunCol * 1.25, pow(max(dot(d, uSun), 0.0), 3.0));
          c = mix(c, cc, cl * 0.75); }
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(2000, 48, 24), mat));
}

// ---- terrain: hills and woods all round the lake ------------------------------
const LAKE = { cx: 0, cz: -150, rx: 210, rz: 165 };
const lakeD = (x, z) => Math.hypot((x - LAKE.cx) / LAKE.rx, (z - LAKE.cz) / LAKE.rz);   // < 1 inside the lake
function vnoise(x, z) {
  const h = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  return (h(ix, iz) * (1 - u) + h(ix + 1, iz) * u) * (1 - v) + (h(ix, iz + 1) * (1 - u) + h(ix + 1, iz + 1) * u) * v;
}
const fbm = (x, z) => { let s = 0, a = 0.5; for (let i = 0; i < 5; i++) { s += a * vnoise(x, z); x *= 2.03; z *= 2.03; a *= 0.5; } return s; };
function groundH(x, z) {
  const d = lakeD(x, z);
  if (d < 0.97) return -3;
  const rise = Math.min(1, (d - 0.97) / 0.5);
  const far = Math.max(0, d - 1.4);
  return -0.6 + rise * 3 + fbm(x * 0.012, z * 0.012) * (6 + far * 70) + far * 25;
}
{
  const S = 1800, N = 220, geo = new THREE.PlaneGeometry(S, S, N, N); geo.rotateX(-Math.PI / 2); geo.translate(0, 0, -200);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), y = groundH(x, z); pos.setY(i, y);
    const n = fbm(x * 0.05, z * 0.05);
    if (y < 0.2) c.setRGB(0.36, 0.32, 0.22);                                  // muddy shore
    else c.setRGB(0.2 + n * 0.12, 0.3 + n * 0.14, 0.12 + n * 0.05).lerp(new THREE.Color(0.32, 0.3, 0.2), Math.min(1, Math.max(0, (y - 18) / 30)));
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
}
// trees: dark conifers and round broadleaf crowns on the slopes
{
  const conifer = new THREE.ConeGeometry(1, 1, 7); conifer.translate(0, 0.5, 0);
  const round = new THREE.IcosahedronGeometry(1, 1); round.translate(0, 0.9, 0);
  const trunk = new THREE.CylinderGeometry(0.12, 0.18, 1, 5); trunk.translate(0, 0.5, 0);
